apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-lab
  namespace: staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - staging.k8s-lab.local
    secretName: k8s-lab-staging-tls
  rules:
  - host: staging.k8s-lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-lab
            port:
              number: 80